<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: #ff0000;
            text-decoration: none;
            font-weight: bold
        }

        a:visited {
            color: #00008b;
        }
        a:hover {
             text-decoration: underline;
             color: #000000;
        }

        a:active {
            color: #00ffff;
        }

        a::after {
            content: '(link)';
            text-decoration: none;
            font-weight: normal;
            color:#319797
        }
      
         .especial {
            background-color: #b3926a91;
         }

         .especial::before {
            content: '♪';
         }
         .especial::after {
            content: '♪';
         }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul> 
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório Github</a></li>
        <li><a href="https://youtube.com/Cursoemvideo/" target="_blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">Site do Cursoemvideo</a></li>
    </ul>
    
</body>
</html>
