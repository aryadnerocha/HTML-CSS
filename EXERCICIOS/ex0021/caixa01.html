<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
      h1 { /* box-level */
        background-color: #83118df8;
        height: 300px;
        width: 300px;
        border: 10px solid #c919a3;
        margin: auto;
        padding: 20px;
      
      }  
     
      a { /* inline-level */
         border-width: 5px;
         border-style: solid;
         border-color: #509c2d;

         }

    </style>
</head>
<body>
<h1>Exemplo de Caixa Box-level</h1>
<p>Parágrafos também são exemplos de box-level, mas os 
<a href="#"> links são exemplos de caixas inline-level. 
</a> Vamos ver como tudo isso funciona.
</p>
    
</body>
</html>
